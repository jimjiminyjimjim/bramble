[build]
  command = "yarn build"
  publish = ".next"

[build.environment]
  # Force Node 18 - Node 20's undici has known issues with diagnostics_channel
  NODE_VERSION = "18.19.0"

[functions]
  # Use Node 18 for functions too
  node_bundler = "esbuild"

[[plugins]]
  package = "@netlify/plugin-nextjs"
